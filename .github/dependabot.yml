version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    reviewers:
      - "atrujimar"
    labels:
      - "dependencies"
      - "automated"
    # Solo patch y minor (sin major)
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"